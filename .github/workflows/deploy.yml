name: Deploy React to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    name: Build frontend
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout source
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: npm ci

      - name: Build React application
        run: npm run build
        env:
          VITE_BASE: /${{ github.event.repository.name }}/

      - name: Verify build output
        shell: bash
        run: |
          set -e

          echo "===== DIST CONTENT ====="
          find dist -maxdepth 3 -type f | sort

          echo "===== CHECK REQUIRED FILES ====="
          test -f dist/index.html
          test -d dist/assets
          test -f dist/map/hung-long.geojson
          test -f dist/images/logo_doan.png
          test -f dist/images/mau-nha-bia.svg
          test -f dist/images/mau-dia-chi-do.svg

          echo "===== CHECK INDEX.HTML ====="
          grep -q "/${{ github.event.repository.name }}/assets/" dist/index.html
          ! grep -q 'src/main.tsx' dist/index.html
          ! grep -q 'href="/assets/' dist/index.html
          ! grep -q 'src="/assets/' dist/index.html

          echo "Build artifact is valid."

      - name: Create SPA fallback
        shell: bash
        run: |
          cp dist/index.html dist/404.html
          touch dist/.nojekyll

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: frontend/dist

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
